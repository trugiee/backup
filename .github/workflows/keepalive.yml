name: Keep database awake

# Supabase free projects pause after ~7 days of inactivity.
# This pings the backend daily; the endpoint runs SELECT 1 on the database.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend database check
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 30 --retry-all-errors \
            --max-time 120 \
            https://mugna.onrender.com/api/health/db
