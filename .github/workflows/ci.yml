name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # --legacy-peer-deps: multer-storage-cloudinary still declares a cloudinary v1 peer
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (informational for now)
        # The codebase has existing lint errors; tighten this by removing
        # continue-on-error once they are cleaned up.
        run: npm run lint
        continue-on-error: true
      - run: npm run build
